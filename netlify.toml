[build]
  publish = "."

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# --- Weiterleitungen alter Jimdo-URLs (301) auf die neuen Seiten ---
# Verhindert 404 bei URLs, die Google noch aus der alten Jimdo-Seite indexiert hat.
# Jimdo nutzte Pfade teils mit, teils ohne Schrägstrich am Ende – beide Formen abgedeckt.
# Neue alte URLs hier ergänzen (aus Google Search Console / site:miriamkammann.de).

# Aesthetics / Mesotherapie (ä als Klartext UND URL-kodiert)
[[redirects]]
  from = "/hyaluronsäure-mesotherapie/"
  to = "/aesthetics.html"
  status = 301
  force = true
[[redirects]]
  from = "/hyalurons%C3%A4ure-mesotherapie/"
  to = "/aesthetics.html"
  status = 301
  force = true

# Physiotherapie-Angebot
[[redirects]]
  from = "/physiotherapie/"
  to = "/#physiotherapie"
  status = 301
  force = true
[[redirects]]
  from = "/physiotherapie"
  to = "/#physiotherapie"
  status = 301
  force = true

